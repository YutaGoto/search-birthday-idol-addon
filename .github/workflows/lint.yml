name: oxlint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  oxlint:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"
          node-version: 22
      - name: Install dependencies
        run: pnpm install
      - name: run oxlint check
        run: pnpm lint:ci
